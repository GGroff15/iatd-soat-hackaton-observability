apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    uid: prometheus

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: loki
    jsonData:
      derivedFields:
        - name: traceId
          matcherRegex: '"(?:traceId|trace_id|traceid)"\s*:\s*"([a-fA-F0-9]{32})"'
          datasourceUid: tempo
          url: '$${__value.raw}'

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        tags: ["service_name"]
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        query: '{service_name=~".+"} |= "$${__trace.traceId}"'
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: "5m"
        spanEndTimeShift: "5m"
        tags: [{key: "service.name", value: "service"}]
        queries:
          - name: "Request rate"
            query: "sum(rate(otelcol_receiver_accepted_spans[5m]))"
